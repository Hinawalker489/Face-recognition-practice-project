<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance System</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👤 Face Recognition Attendance System</h1>
            <p>Register and recognize faces for automatic attendance tracking</p>
        </header>

        <div class="main-content">
            <!-- Registration Section -->
            <div class="section registration-section">
                <h2>📝 User Registration</h2>
                <div class="form-group">
                    <input type="text" id="regName" placeholder="Enter Full Name" required>
                    <input type="text" id="regUserId" placeholder="Enter User ID" required>
                </div>
                <div class="camera-container">
                    <video id="regVideo" autoplay muted></video>
                    <canvas id="regCanvas" style="display: none;"></canvas>
                    <div class="camera-overlay">
                        <div class="face-frame" id="regFaceFrame"></div>
                        <div class="status-text" id="regStatus">Position your face in the frame</div>
                    </div>
                </div>
                <button id="regCaptureBtn" class="btn btn-primary">📸 Capture & Register</button>
                <div id="regMessage" class="message"></div>
            </div>

            <!-- Recognition Section -->
            <div class="section recognition-section">
                <h2>🔍 Face Recognition</h2>
                <div class="camera-container">
                    <video id="recVideo" autoplay muted></video>
                    <canvas id="recCanvas" style="display: none;"></canvas>
                    <div class="camera-overlay">
                        <div class="face-frame" id="recFaceFrame"></div>
                        <div class="status-text" id="recStatus">Position your face for recognition</div>
                    </div>
                </div>
                <button id="recCaptureBtn" class="btn btn-success">🔍 Recognize Face</button>
                <div id="recMessage" class="message"></div>
            </div>

            <!-- Registered Users Section -->
            <div class="section users-section">
                <h2>👥 Registered Users</h2>
                <button id="loadUsersBtn" class="btn btn-warning">🔄 Refresh Users List</button>
                <div class="users-container">
                    <div id="usersList" class="users-list">
                        <!-- Users will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Attendance Report Section -->
            <div class="section report-section">
                <h2>📊 Attendance Report</h2>
                <button id="loadReportBtn" class="btn btn-info">📋 Load Report</button>
                <div class="report-container">
                    <table id="attendanceTable" class="attendance-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>User ID</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="camera-controls">
            <button id="startCameraBtn" class="btn btn-secondary">🎥 Start Camera</button>
            <button id="stopCameraBtn" class="btn btn-secondary" disabled>⏹️ Stop Camera</button>
        </div>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
